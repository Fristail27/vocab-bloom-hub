version: 2

# Every manifest of the monorepo (issue #407): the Yarn workspaces share one
# lockfile but Dependabot reads each package.json on its own, so every
# workspace directory is listed; the Python SDK is a uv project. Updates are
# grouped per directory so a week's bumps arrive as one PR rather than a dozen.
updates:
  - package-ecosystem: 'npm'
    directories:
      - '/'
      - '/apps/frontend'
      - '/apps/server'
      - '/apps/site'
      - '/apps/e2e'
      - '/packages/npm-sdk'
    schedule:
      interval: 'weekly'

    # TypeScript 7 breaks the builds: stay on the 6.x line until the move is
    # made on purpose, in its own PR (minor and patch updates still arrive)
    ignore:
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

    groups:
      npm-all:
        patterns:
          - '*'

  - package-ecosystem: 'uv'
    directory: '/packages/python-sdk'
    schedule:
      interval: 'weekly'

    groups:
      python-all:
        patterns:
          - '*'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'

    groups:
      actions:
        patterns:
          - '*'
