name: release

# The whole release rides on one tag push (issues #308, #310, #374): the same
# push builds the Docker images (docker.yml) while this workflow verifies the
# tag against the version, publishes the npm and PyPI packages and creates the
# GitHub Release with generated notes. The Release is created here, not the
# other way around: a Release made by a workflow's GITHUB_TOKEN would never
# trigger another workflow. The flow is documented in CONTRIBUTING.md#releasing.
#
# The publish jobs authenticate with OIDC trusted publishing — no tokens in
# Secrets. The very first npm publish is manual (npm attaches a trusted
# publisher only to an existing package); PyPI's pending publisher covers the
# first one.
#
# "Run workflow" (workflow_dispatch) repeats the publishes of an existing tag
# from the workflow file on main — for a publish job that failed on the tag
# push, since a re-run would use the workflow as it was at that tag. The
# Release itself is created on the tag push only.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'The release tag to publish (v0.2.0-beta.1)'
        required: true
        type: string
      npm:
        description: 'Publish @vocab-bloom-hub/client to npm'
        type: boolean
        default: true
      pypi:
        description: 'Publish vocab-bloom-hub to PyPI'
        type: boolean
        default: false

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  guard:
    name: tag matches the version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      # the six version fields are kept equal by CI (version-sync.spec.ts);
      # here the tag itself is checked against them before anything publishes
      - name: Release tag equals the package version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$RELEASE_TAG" != "v$version" ]; then
            echo "::error::release tag $RELEASE_TAG does not match package.json version $version"
            exit 1
          fi

  npm:
    name: publish @vocab-bloom-hub/client to npm
    needs: guard
    if: github.event_name == 'push' || inputs.npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      # the SDK's live suite boots the NestJS server, which is ESM-only: Jest
      # needs Node 24.9+ for require(esm), the same as the test jobs of CI
      - name: Setup workspace
        uses: ./.github/actions/setup
        with:
          node-version: 24

      - name: Generated types are up to date
        run: yarn workspace @vocab-bloom-hub/client generate:check

      - name: Tests
        run: yarn jest --selectProjects sdk

      - name: Build
        run: yarn workspace @vocab-bloom-hub/client build

      - name: Package resolves for every consumer (publint, arethetypeswrong)
        run: yarn workspace @vocab-bloom-hub/client pack:check

      # OIDC trusted publishing: npm >= 11.5 exchanges the workflow identity
      # for the publish right, provenance included, no token involved.
      # npm refuses a bare publish of a prerelease — the dist-tag must be
      # named, and an alpha must never take `latest`: the channel comes from
      # the git tag (v0.1.0-alpha.1 → alpha, a stable tag → latest)
      - name: Publish
        working-directory: packages/npm-sdk
        run: |
          case "$RELEASE_TAG" in
            *-*) channel="${RELEASE_TAG#*-}"; channel="${channel%%.*}" ;;
            *) channel=latest ;;
          esac
          npm publish --tag "$channel"

  pypi:
    name: publish vocab-bloom-hub to PyPI
    needs: guard
    if: github.event_name == 'push' || inputs.pypi
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Generated models are up to date
        working-directory: packages/python-sdk
        run: |
          uv sync --locked
          uv run python scripts/generate_models.py --check

      # The suites that need no server (issue #409): the unit tests and the
      # contract map against the committed spec — the live ones ran on the
      # pull request; here there is no Node workspace to boot the server
      - name: Tests (offline suites)
        working-directory: packages/python-sdk
        run: uv run pytest tests/test_unit.py tests/test_contract.py

      - name: Build
        working-directory: packages/python-sdk
        run: uv build

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/python-sdk/dist

  github-release:
    name: create the GitHub Release
    # only the guard: the Release (the notes) must appear even when a publish
    # job fails — expected once, on the very first npm publish (see the header)
    needs: guard
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      # categories of the generated notes live in .github/release.yml;
      # a hyphen in the tag (v0.1.0-alpha.1) marks the Release a prerelease
      - name: Create the Release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=''
          case "$RELEASE_TAG" in *-*) prerelease='--prerelease' ;; esac
          gh release create "$RELEASE_TAG" --verify-tag --generate-notes $prerelease
