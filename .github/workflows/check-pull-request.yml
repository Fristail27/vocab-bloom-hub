name: check-pull-request

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup workspace
        uses: ./.github/actions/setup

      - name: Lint
        run: yarn lint

      - name: Prettier check
        run: yarn format:check

      # The committed public OpenAPI spec must match the code (issue #273)
      - name: OpenAPI spec is up to date
        run: yarn workspace server openapi:check

      - name: SDK types are up to date with the OpenAPI spec
        run: yarn workspace @vocab-bloom-hub/client generate:check

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup workspace
        uses: ./.github/actions/setup

      - name: Typecheck frontend
        run: yarn workspace frontend tsc --noEmit

      - name: Typecheck server
        run: yarn workspace server tsc --noEmit

      - name: Typecheck SDK
        run: yarn workspace @vocab-bloom-hub/client typecheck

  tests:
    name: tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup workspace
        uses: ./.github/actions/setup

      - name: Build SDK
        run: yarn workspace @vocab-bloom-hub/client build

      - name: Unit tests
        run: yarn test

      - name: Server e2e tests
        run: yarn workspace server test:e2e

  python-sdk:
    name: python-sdk
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup workspace
        uses: ./.github/actions/setup

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: packages/python-sdk/uv.lock

      - name: Install
        run: uv sync --locked
        working-directory: packages/python-sdk

      - name: Generated models are up to date with the OpenAPI spec
        run: uv run python scripts/generate_models.py --check
        working-directory: packages/python-sdk

      - name: Lint and format
        run: uv run ruff check . && uv run ruff format --check .
        working-directory: packages/python-sdk

      - name: Typecheck
        run: uv run mypy
        working-directory: packages/python-sdk

      - name: Tests (unit + the client against the real server)
        run: uv run pytest
        working-directory: packages/python-sdk

      - name: Build the distribution
        run: uv build
        working-directory: packages/python-sdk

  postgres:
    name: postgres-only tests
    runs-on: ubuntu-latest

    # The suites that need Postgres: the query-plan guard of the public reads
    # (issue #279: with sequential scans disabled, every statement of a hot
    # endpoint must find an index even on an empty database) and the trigram
    # search (#278: pg_trgm, created by its migration)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vocab
          POSTGRES_PASSWORD: vocab
          POSTGRES_DB: vocab_bloom
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vocab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://vocab:vocab@localhost:5432/vocab_bloom
      ADMIN_USERNAME: plans-admin
      ADMIN_PASSWORD: plans-password

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup workspace
        uses: ./.github/actions/setup

      - name: Apply migrations
        run: yarn workspace server migration:run

      - name: Postgres-only tests (query plans, trigram search)
        run: yarn workspace server test:postgres

  e2e:
    name: browser e2e
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup workspace
        uses: ./.github/actions/setup

      # The frontend build script wraps the command with dotenv -e ../../.env;
      # all e2e-relevant variables are passed explicitly, the file just has to exist
      - name: Create empty root .env
        run: touch .env

      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(yarn workspace e2e exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Chromium
        run: yarn workspace e2e exec playwright install --with-deps chromium

      - name: Build frontend for e2e
        run: yarn e2e:build

      - name: Run browser e2e tests
        run: yarn workspace e2e test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/e2e/playwright-report
            apps/e2e/test-results
          retention-days: 7
