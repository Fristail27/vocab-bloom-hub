name: check-pull-request

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

# a force-push cancels the superseded run instead of burning its 8 jobs to
# the end; pushes to main always run to completion (issue #354)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# the jobs only read the checkout; nothing here writes to the repo or GHCR
permissions:
  contents: read

# Every job has a timeout (issue #409): a hung step fails in minutes instead
# of holding a runner for the six-hour default
jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup workspace
        uses: ./.github/actions/setup

      - name: Lint
        run: yarn lint

      - name: Prettier check
        run: yarn format:check

      # Yarn only warns about unmet peer dependencies; this fails on any that
      # is not a documented known mismatch (issue #407)
      - name: Peer dependencies are met
        run: yarn peers:check

      # The committed public OpenAPI spec must match the code (issue #273)
      - name: OpenAPI spec is up to date
        run: yarn workspace server openapi:check

      - name: SDK types are up to date with the OpenAPI spec
        run: yarn workspace @vocab-bloom-hub/client generate:check

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup workspace
        uses: ./.github/actions/setup

      - name: Typecheck frontend
        run: yarn workspace frontend tsc --noEmit
      - name: Typecheck site
        run: yarn workspace site tsc --noEmit

      - name: Typecheck server
        run: yarn workspace server tsc --noEmit

      - name: Typecheck SDK
        run: yarn workspace @vocab-bloom-hub/client typecheck

      - name: Typecheck browser e2e
        run: yarn workspace e2e typecheck

  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup workspace
        uses: ./.github/actions/setup

      - name: Build SDK
        run: yarn workspace @vocab-bloom-hub/client build

      - name: Unit tests
        run: yarn test

      # The server unit suites again, with coverage over every source file
      # (issue #409): jest fails the step when a figure drops below the
      # thresholds of apps/server/jest.config.ts
      - name: Server unit coverage does not regress
        run: yarn workspace server test:cov --silent

      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: server-coverage
          path: apps/server/coverage/lcov-report
          retention-days: 7

      - name: Server e2e tests
        run: yarn workspace server test:e2e

  python-sdk:
    name: python-sdk (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # the oldest and the newest interpreter the package claims (pyproject
    # classifiers 3.10–3.13, issue #409)
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup workspace
        uses: ./.github/actions/setup

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: packages/python-sdk/uv.lock

      - name: Install
        run: uv sync --locked
        working-directory: packages/python-sdk

      - name: Generated models are up to date with the OpenAPI spec
        run: uv run python scripts/generate_models.py --check
        working-directory: packages/python-sdk

      - name: Lint and format
        run: uv run ruff check . && uv run ruff format --check .
        working-directory: packages/python-sdk

      - name: Typecheck
        run: uv run mypy
        working-directory: packages/python-sdk

      - name: Tests (unit + the client against the real server)
        run: uv run pytest
        working-directory: packages/python-sdk

      - name: Build the distribution
        run: uv build
        working-directory: packages/python-sdk

  postgres:
    name: postgres-only tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The suites that need Postgres: the query-plan guard of the public reads
    # (issue #279: with sequential scans disabled, every statement of a hot
    # endpoint must find an index even on an empty database), the trigram
    # search (#278: pg_trgm, created by its migration), and the full server
    # e2e suite on the production database (#400)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vocab
          POSTGRES_PASSWORD: vocab
          POSTGRES_DB: vocab_bloom
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vocab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://vocab:vocab@localhost:5432/vocab_bloom
      ADMIN_USERNAME: plans-admin
      ADMIN_PASSWORD: plans-password

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup workspace
        uses: ./.github/actions/setup

      - name: Apply migrations
        run: yarn workspace server migration:run

      # The newest migration must also come back down cleanly (issue #400)
      - name: Migration revert smoke (down one, up again)
        run: yarn workspace server migration:revert && yarn workspace server migration:run

      - name: Postgres-only tests (query plans, trigram search)
        run: yarn workspace server test:postgres

      # The whole e2e suite on the database operators actually run (issue
      # #400): setup-e2e.ts gives every jest worker its own database derived
      # from this URL and resets its schema per spec file
      - name: Server e2e suite on Postgres
        run: yarn workspace server test:e2e
        env:
          E2E_DATABASE_URL: postgresql://vocab:vocab@localhost:5432/vocab_bloom

  production-start:
    name: production build and start
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The built artifacts are started the way an operator starts them (issue
    # #315): `yarn build`, then `yarn start` against Postgres — production
    # refuses SQLite — until the readiness probe and the login page answer;
    # then SIGTERM must stop the server gracefully within SHUTDOWN_TIMEOUT
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vocab
          POSTGRES_PASSWORD: vocab
          POSTGRES_DB: vocab_bloom
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vocab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: production
      DATABASE_URL: postgresql://vocab:vocab@localhost:5432/vocab_bloom
      ADMIN_USERNAME: smoke-admin
      ADMIN_PASSWORD: smoke-password
      SERVER_PORT: '3010'
      PORT: '3000'
      NEXT_PUBLIC_BASE_API_URL: http://localhost:3010/api
      CORS_ORIGINS: http://localhost:3000
      SHUTDOWN_TIMEOUT: '20'
      LOG_LEVEL: log

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup workspace
        uses: ./.github/actions/setup

      - name: Production build (server + frontend)
        run: yarn build

      - name: Start, probe, stop gracefully
        run: bash .github/scripts/production-smoke.sh

      - name: Upload the start log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: production-smoke-log
          path: production-smoke.log
          retention-days: 7

  docker:
    name: docker images and compose
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # The Dockerfiles and docker-compose.yml (issue #316) are exercised the way
    # an operator uses them: build the three images, `docker compose up` with
    # the site profile, wait for the readiness probe and the login page, sign
    # in over plain http (the cookie must not be `secure` there), check the
    # website reaches the API, stop gracefully
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Environment file
        run: |
          cp .env.example .env
          sed -i 's/^ADMIN_PASSWORD=.*/ADMIN_PASSWORD=ci-admin-password/; s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-postgres-password/; s#^DATABASE_URL=.*#DATABASE_URL=postgres://vocab:ci-postgres-password@postgres:5432/vocab_bloom#' .env
          # the full dictionary from HuggingFace takes minutes and a network;
          # the automatic import is covered by the server e2e suite instead
          echo 'DICTIONARY_AUTO_IMPORT=false' >> .env
          # the website too (profile `site`), so its image and its wiring are checked
          sed -i 's/^COMPOSE_PROFILES=.*/COMPOSE_PROFILES=db,site/' .env

      # the build override: the images of this checkout, not the published ones
      - name: Build images and start
        run: docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build --wait --wait-timeout 300

      - name: Probe and sign in
        run: bash .github/scripts/compose-smoke.sh

      - name: Stop gracefully
        run: |
          docker compose stop -t 45 server
          docker compose logs server | grep -q 'Shutdown complete (SIGTERM)'
          docker compose down -v

      - name: Compose logs
        if: failure()
        run: docker compose logs

  e2e:
    name: browser e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup workspace
        uses: ./.github/actions/setup

      # The frontend build script wraps the command with dotenv -e ../../.env;
      # all e2e-relevant variables are passed explicitly, the file just has to exist
      - name: Create empty root .env
        run: touch .env

      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(yarn workspace e2e exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Chromium
        run: yarn workspace e2e exec playwright install --with-deps chromium

      - name: Build frontend for e2e
        run: yarn e2e:build

      - name: Run browser e2e tests
        run: yarn workspace e2e test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/e2e/playwright-report
            apps/e2e/test-results
          retention-days: 7

  site-e2e:
    name: site browser e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup workspace
        uses: ./.github/actions/setup

      # The site build script wraps the command with dotenv -e ../../.env;
      # all e2e-relevant variables are passed explicitly, the file just has to exist
      - name: Create empty root .env
        run: touch .env

      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(yarn workspace e2e exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Chromium
        run: yarn workspace e2e exec playwright install --with-deps chromium

      - name: Build the website for e2e
        run: yarn e2e:site:build

      - name: Run site browser e2e tests
        run: yarn workspace e2e test:site

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: site-playwright-report
          path: |
            apps/e2e/playwright-report
            apps/e2e/test-results
          retention-days: 7

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Known vulnerabilities of high severity and above in the dependency
    # trees (issue #409): the npm workspaces including transitive packages,
    # and the Python SDK's environment. A finding fails the job; the fix is
    # `yarn up -R <package>` / a lock refresh, never a silenced advisory
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup workspace
        uses: ./.github/actions/setup

      - name: npm audit (all workspaces, transitive, high and above)
        run: yarn npm audit --all --recursive --severity high

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: packages/python-sdk/uv.lock

      - name: pip-audit (the Python SDK environment)
        working-directory: packages/python-sdk
        run: |
          uv sync --locked
          uv run --with pip-audit pip-audit --skip-editable
