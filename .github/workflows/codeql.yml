name: 'CodeQL'

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  schedule:
    - cron: '0 3 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest

    permissions:
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        # javascript covers TypeScript; python is the published SDK (issue #354)
        language: ['javascript', 'python']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # the same Node/Yarn setup as every other job — the workflow used to
      # hand-roll it with a hardcoded Yarn version that drifted off the
      # packageManager pin (issue #354); python needs no dependencies
      - name: Setup workspace
        if: matrix.language == 'javascript'
        uses: ./.github/actions/setup

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.8
        with:
          languages: ${{ matrix.language }}

      - name: Build frontend
        if: matrix.language == 'javascript'
        run: yarn workspace frontend build
        continue-on-error: true

      - name: Build backend
        if: matrix.language == 'javascript'
        run: yarn workspace server build
        continue-on-error: true

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.37.8
