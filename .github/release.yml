# Categories of the generated release notes (gh release create --generate-notes)
changelog:
  exclude:
    # the bot's login carries the suffix; the label catches the same PRs
    authors:
      - dependabot[bot]
    labels:
      - dependencies
  categories:
    - title: Features
      labels:
        - enhancement
        - feature
    - title: Fixes
      labels:
        - bug
    - title: Documentation
      labels:
        - documentation
    - title: Everything else
      labels:
        - '*'
