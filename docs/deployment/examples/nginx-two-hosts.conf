# nginx for a public instance on two hostnames (docs/deployment/reverse-proxy.md,
# profile (c) with an admin host): the layout the project website itself runs on.
#
#   dict.example.com        the website (docs, API reference, playground, word pages)
#                           and the public API under /api/v1; the admin prefixes
#                           answer 404 here, whatever the server would say
#   admin.dict.example.com  the admin UI and the admin API, for trusted addresses only,
#                           with a certificate of its own
#   www.dict.example.com    a redirect to the bare hostname (one canonical origin
#                           for search engines)
#
# Upstreams are the compose host ports (docker-compose.yml): 3240 (API),
# 3241 (admin UI), 3242 (website); use 3010 / 3000 / 3020 for a native start.
# Certificates from certbot (`certbot --nginx -d dict.example.com -d www.dict.example.com`
# and again for admin.dict.example.com) or any other source.

upstream vbh_server   { server 127.0.0.1:3240; }
upstream vbh_frontend { server 127.0.0.1:3241; }
upstream vbh_site     { server 127.0.0.1:3242; }

# --- http → https, www → bare
server {
    listen 80;
    listen [::]:80;
    server_name dict.example.com www.dict.example.com admin.dict.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.dict.example.com;

    ssl_certificate     /etc/letsencrypt/live/dict.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dict.example.com/privkey.pem;

    return 301 https://dict.example.com$request_uri;
}

# --- the public host: website + public API
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dict.example.com;

    ssl_certificate     /etc/letsencrypt/live/dict.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dict.example.com/privkey.pem;

    # TLS ends here: tell browsers to come back over https only
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # the admin prefixes do not exist on this host (a regex location wins over /api/)
    location ~ ^/api/(en|settings|auth)(/|$) {
        return 404;
    }

    # the public API and the probes; /api/v1 answers carry ETag and Cache-Control,
    # a CDN or a proxy cache in front may keep them (docs/api.md#caching)
    location /api/ {
        proxy_pass http://vbh_server;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # the website; its word and browse pages are regenerated on demand and say
    # `Cache-Control: s-maxage=3600, stale-while-revalidate=86400` — a
    # proxy_cache here keeps them, a plain pass-through works too
    location / {
        proxy_pass http://vbh_site;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- the admin host: admin UI + admin API, trusted addresses only
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name admin.dict.example.com;

    ssl_certificate     /etc/letsencrypt/live/admin.dict.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.dict.example.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # who may open the admin at all: the office / VPN ranges; basic auth
    # (auth_basic) is the alternative when the addresses are not fixed
    allow 10.0.0.0/8;
    allow 127.0.0.1;    # the admin UI's server-side rendering, when it runs on this host
    allow ::1;
    deny  all;

    # dataset upload (import from an archive)
    client_max_body_size 512m;

    location /api/ {
        proxy_pass http://vbh_server;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # import / export progress is an NDJSON stream: deliver lines as they come
        proxy_buffering         off;
        proxy_request_buffering off;
        proxy_read_timeout      600s;
    }

    location / {
        proxy_pass http://vbh_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# .env of the instance behind this file:
#   NEXT_PUBLIC_BASE_API_URL=https://admin.dict.example.com/api   (the admin UI calls the API on its own host)
#   CORS_ORIGINS=https://admin.dict.example.com
#   NEXT_PUBLIC_SITE_URL=https://dict.example.com                  (a build argument, docker.md#the-website)
#   TRUST_PROXY=1
