# Optional RFC 2229 TCP listener on the existing server, bound to localhost.
# docker compose -f docker-compose.yml -f docker-compose.dict.yml up -d
services:
  server:
    environment:
      DICT_ENABLED: 'true'
      DICT_HOST: 0.0.0.0
      DICT_PORT: 2628
    ports:
      - '127.0.0.1:${DICT_PORT:-2628}:2628'
