approvedGitRepositories:
  - '**'

enableScripts: true

nodeLinker: node-modules

npmMinimalAgeGate: 0

# @next/eslint-plugin-next depends on @eslint-community/eslint-utils, whose
# peer is eslint, without declaring eslint as its own peer; the root
# workspace provides ESLint to it (yarn peers:check)
# The package.json resolution for version 16.3.8 replaces its fast-glob
# with tinyglobby. Its patch disables directory expansion to preserve
# getRootDirs semantics; scripts/check-next-eslint.mjs checks this contract.
# This removes micromatch -> braces (unpatched
# GHSA-vfj7-8cjw-p6xm). Revisit on plugin upgrades; remove the resolution
# once upstream drops the vulnerable chain.
packageExtensions:
  '@next/eslint-plugin-next@*':
    peerDependencies:
      eslint: '*'
