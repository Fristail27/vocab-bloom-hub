[project]
name = "vocab-bloom-hub"
version = "0.1.0-alpha.3"
description = "Typed Python client for the Vocab Bloom Hub public dictionary API (/api/v1): sync and async, pydantic models, cursor iteration, ETag cache."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Alexey Ryzhov (Fristail27)" }]
keywords = ["dictionary", "vocabulary", "english", "api-client", "sdk", "vocab-bloom-hub"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "typing-extensions>=4.5",
]

[project.optional-dependencies]
pandas = ["pandas>=2.0"]

[project.urls]
Homepage = "https://github.com/Fristail27/vocab-bloom-hub/tree/main/packages/python-sdk#readme"
Repository = "https://github.com/Fristail27/vocab-bloom-hub"
Issues = "https://github.com/Fristail27/vocab-bloom-hub/issues"
Documentation = "https://github.com/Fristail27/vocab-bloom-hub/blob/main/docs/api.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vocab_bloom_hub"]

[dependency-groups]
dev = [
  "datamodel-code-generator>=0.28",
  "mypy>=1.14",
  "pandas>=2.0",
  "pandas-stubs>=2.0",
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.9",
]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["src/vocab_bloom_hub/_generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
packages = ["vocab_bloom_hub"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
